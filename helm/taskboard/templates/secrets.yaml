apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secrets
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "taskboard.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
