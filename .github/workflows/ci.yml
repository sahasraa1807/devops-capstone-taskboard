name: TaskBoard CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/taskboard-frontend

jobs:
  # ==========================================
  # Quality Gate: Automated Testing & Code Check
  # ==========================================
  test-and-lint:
    name: Run Pytest & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Quality Gate
        run: |
          cd backend
          pytest -v

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # ==========================================
  # Security Scan & Container Publishing (GHCR)
  # ==========================================
  build-scan-and-push:
    name: Docker Build, Trivy Security Scan & GHCR Push
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert Repository Owner to Lowercase
        id: prep
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-backend:latest \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-frontend:latest \
            ./frontend

      # DevSecOps: Trivy Container Vulnerability Scan
      - name: Trivy Scan Backend Image (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Scan Frontend Image (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Images to GHCR with Git SHA Tag
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-backend:latest
          docker push ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/taskboard-frontend:latest

  # ==========================================
  # Helm Chart Validation
  # ==========================================
  helm-validation:
    name: Helm Lint & Validate
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/taskboard
