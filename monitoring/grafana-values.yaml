# ==========================================
# Grafana Custom Helm Values & Dashboards
# ==========================================

adminPassword: "admin"

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-operated.monitoring.svc:9090
        access: proxy
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'taskboard-dashboards'
        orgId: 1
        folder: 'TaskBoard SaaS'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/taskboard

dashboards:
  taskboard:
    taskboard-metrics:
      file: dashboards/taskboard-dashboard.json
